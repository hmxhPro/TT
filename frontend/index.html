<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/科大logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频检测控制台</title>
    <script>
      // Apply the saved theme before React mounts to avoid a flash. Defaults to light.
      (function () {
        try {
          if (localStorage.getItem('sod_theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
